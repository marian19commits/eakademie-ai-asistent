<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Firemní Chatbot</title>
  <link rel="stylesheet" href="{{ RELATIVE_URL }}/static/style.css">
</head>
<body style="margin: 0; padding: 0;">
  <div class="chat-container">
    <!--<h2>💬 Test Chatbot</h2>-->
    <div id="chat-box"></div>
    <div class="input-row">
      <input type="text" id="user-input" placeholder="Napište dotaz ...">
      <button class="chat-button" onclick="sendMessage()">Odeslat</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const msg = input.value.trim();
      if (!msg) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<div class="user-msg"><b style="color: #0078d4;">Vy .. </b> ${msg}</div>`;
      input.value = "";

      const res = await fetch("{{ RELATIVE_URL }}/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      chatBox.innerHTML += `<div class="bot-msg"><b style="color: #0078d4;">Bot .. </b> ${data.reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
