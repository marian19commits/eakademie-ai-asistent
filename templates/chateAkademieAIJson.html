<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eAkademie chatbot</title>
  <!-- Moderní systémové písmo Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --user-bubble: #2563eb;
      --user-text: #ffffff;
      --bot-bubble: #f1f5f9;
      --bot-text: #0f172a;
      --border-color: #e2e8f0;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 5px;
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 95vh;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Zkompaktněná hlavička */
    .chat-header {
      padding: 8px 12px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-header h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* Maximální prostor pro zprávy */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    /* Zkompaktněné zprávy */
    .user-msg, .bot-msg {
      max-width: 88%;
      padding: 8px 12px;
      font-size: 0.875rem;
      line-height: 1.4;
      position: relative;
      animation: fadeIn 0.2s ease-out;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: var(--user-text);
      border-radius: 12px 12px 2px 12px;
    }

    .bot-msg {
      align-self: flex-start;
      background-color: var(--bot-bubble);
      color: var(--bot-text);
      border-radius: 12px 12px 12px 2px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .user-label, .bot-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 500;
      margin-bottom: 3px;
      opacity: 0.75;
    }

    .user-msg .user-label {
      color: rgba(255, 255, 255, 0.9);
      justify-content: flex-end;
    }

    .bot-msg .bot-label {
      color: var(--text-muted);
    }

    /* Ikona kopírování */
    .copy-icon {
      position: absolute;
      top: 6px;
      right: 6px;
      cursor: pointer;
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      opacity: 0;
      transition: all 0.2s ease;
    }

    .bot-msg:hover .copy-icon {
      opacity: 1;
    }

    .copy-icon:hover {
      fill: var(--primary);
    }

    .tooltip {
      position: absolute;
      top: -24px;
      right: 4px;
      background-color: #0f172a;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      z-index: 10;
    }

    .tooltip.show {
      opacity: 1;
    }

    /* Kompaktní dolní lišta s inputem a tlačítkem */
    .input-row {
      padding: 8px 12px;
      background-color: #ffffff;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      flex-grow: 1;
    }

    #user-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      background-color: #f8fafc;
    }

    #user-input:focus {
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    /* Malá a úsporná tlačítka */
    .chat-button {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-send {
      background-color: var(--primary);
      color: white;
    }

    .btn-send:hover {
      background-color: var(--primary-hover);
    }

    .btn-reset {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-reset:hover {
      background-color: #f1f5f9;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* Animace a přemýšlení */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 0;
    }

    .thinking-dots span {
      width: 5px;
      height: 5px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Úprava pro prvky z Markdownu uvnitř bot zprávy */
    .bot-msg h1, .bot-msg h2, .bot-msg h3 {
      font-size: 0.95rem;
      margin-top: 8px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .bot-msg p {
      margin-bottom: 6px;
    }

    .bot-msg p:last-child {
      margin-bottom: 0;
    }

    .bot-msg ul, .bot-msg ol {
      margin-left: 18px;
      margin-bottom: 6px;
    }

    .bot-msg a {
      color: var(--primary);
      text-decoration: underline;
      font-weight: 500;
    }

    .bot-msg a:hover {
      color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Máte otázky ?</h1>
      <button class="chat-button btn-reset" onclick="reset()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
    </div>

    <div id="chat-box"></div>

    <div class="input-row">
      <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Ptejte se ...">
      </div>
      <button class="chat-button btn-send" onclick="sendMessage()">
        Odeslat
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script>
    document.getElementById("user-input").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const msg = input.value.trim();
      if (!msg) return;

      const chatBox = document.getElementById("chat-box");
      const time = getCurrentTime();

      chatBox.innerHTML += `
        <div class="user-msg">
          <div class="user-label">
            <span>Vy</span> • <span>${time}</span>
          </div>
          <div>${msg}</div>
        </div>`;
      input.value = "";

      const thinkingId = `thinking-${Date.now()}`;
      const botId = `bot-${Date.now()}`;
      chatBox.innerHTML += `
        <div class="bot-msg" id="${thinkingId}">
          <div class="bot-label">
            <span>AI Asistent</span> • <span>${getCurrentTime()}</span>
          </div>
          <div class="thinking-dots">
            <span></span><span></span><span></span>
          </div>
        </div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("{{ RELATIVE_URL }}/askchateAkademieAIJson/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        if (!res.ok || !res.body) {
          throw new Error("Stream se nepodařilo spustit.");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let reply = "";
        let botInserted = false;

        const ensureBotMessage = () => {
          if (botInserted) return;
          const botMsg = `
            <div class="bot-msg" id="${botId}">
              <div class="bot-label">
                <span>AI Asistent</span> • <span>${getCurrentTime()}</span>
              </div>
              <div class="bot-content"></div>
              <svg class="copy-icon" viewBox="0 0 24 24" onclick="copyToClipboard('${botId}', this)" onmouseover="showTooltip(this, 'Kopírovat')" onmouseout="hideTooltip(this)">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
              <div class="tooltip">Zkopírováno</div>
            </div>`;
          document.getElementById(thinkingId).outerHTML = botMsg;
          botInserted = true;
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const part of parts) {
            const line = part.split("\n").find((row) => row.startsWith("data: "));
            if (!line) continue;

            const chunk = line.slice(6);
            if (chunk === "[CHYBA]") {
              throw new Error("Chyba při streamování odpovědi.");
            }

            if (chunk.startsWith("[CHYBA] ")) {
              throw new Error(chunk.slice(8));
            }

            ensureBotMessage();
            reply += chunk;
            const contentEl = document.querySelector(`#${botId} .bot-content`);
            if (contentEl) {
              contentEl.innerHTML = marked.parse(reply)
                .replace(/<p>/g, '<p style="margin: 0 0 0.5rem 0;">')
                .replace(/<ul>/g, '<ul style="margin: 0.25rem 0 0.5rem 1.25rem; padding-left: 1rem;">')
                .replace(/<ol>/g, '<ol style="margin: 0.25rem 0 0.5rem 1.25rem; padding-left: 1rem;">')
                .replace(/<li>/g, '<li style="margin: 0.15rem 0;">')
                .replace(/<h1>/g, '<h1 style="margin: 0 0 0.5rem 0; font-size: 1.1rem;">')
                .replace(/<h2>/g, '<h2 style="margin: 0 0 0.5rem 0; font-size: 1rem;">')
                .replace(/<h3>/g, '<h3 style="margin: 0 0 0.4rem 0; font-size: 0.95rem;">');
            }
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        }

        ensureBotMessage();
        const contentEl = document.querySelector(`#${botId} .bot-content`);
        if (contentEl) {
          contentEl.innerHTML = marked.parse(reply || "")
            .replace(/<p>/g, '<p style="margin: 0 0 0.5rem 0;">')
            .replace(/<ul>/g, '<ul style="margin: 0.25rem 0 0.5rem 1.25rem; padding-left: 1rem;">')
            .replace(/<ol>/g, '<ol style="margin: 0.25rem 0 0.5rem 1.25rem; padding-left: 1rem;">')
            .replace(/<li>/g, '<li style="margin: 0.15rem 0;">')
            .replace(/<h1>/g, '<h1 style="margin: 0 0 0.5rem 0; font-size: 1.1rem;">')
            .replace(/<h2>/g, '<h2 style="margin: 0 0 0.5rem 0; font-size: 1rem;">')
            .replace(/<h3>/g, '<h3 style="margin: 0 0 0.4rem 0; font-size: 0.95rem;">');
        }
      } catch (err) {
        document.getElementById(thinkingId).innerHTML = `<div style="color: #ef4444;">Chyba při komunikaci se serverem.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function reset() {
      await fetch("{{ RELATIVE_URL }}/resetchateAkademieAIJson", { method: "GET" });
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "";
      chatBox.scrollTop = 0;
    }

    function copyToClipboard(id, iconElement) {
      const element = document.getElementById(id);
      if (!element) return;

      const textNode = element.querySelector('div:nth-child(2)');
      const text = textNode ? textNode.innerText : element.innerText;

      navigator.clipboard.writeText(text).then(() => {
        const tooltip = iconElement.nextElementSibling;
        tooltip.textContent = "Zkopírováno!";
        tooltip.classList.add("show");
        setTimeout(() => {
          tooltip.classList.remove("show");
          tooltip.textContent = "Kopírovat";
        }, 1500);
      }).catch(err => {
        console.error("Kopírování selhalo:", err);
      });
    }

    function showTooltip(el, text) {
      const tooltip = el.nextElementSibling;
      if (tooltip && tooltip.classList.contains("tooltip")) {
        tooltip.textContent = text;
        tooltip.classList.add("show");
      }
    }

    function hideTooltip(el) {
      const tooltip = el.nextElementSibling;
      if (tooltip && tooltip.classList.contains("tooltip")) {
        tooltip.classList.remove("show");
      }
    }
  </script>
</body>
</html>
